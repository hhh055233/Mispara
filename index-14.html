<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>המספרה של דני | קביעת תור</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root{--ink:#14223a;--red:#c8372d;--blue:#2b5aa8;--paper:#f3f5f8;--line:#d5dbe4;--mut:#56647a}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.6 Heebo,system-ui,Arial,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.pole{height:12px;background:repeating-linear-gradient(135deg,var(--red) 0 14px,#fff 14px 28px,var(--blue) 28px 42px,#fff 42px 56px)}
main{max-width:640px;margin:0 auto;padding:0 18px 48px}
h1,h2{font-family:"Secular One",Heebo,sans-serif;font-weight:400;margin:0}
h1{font-size:clamp(44px,13vw,68px);line-height:1.05;margin:36px 0 12px}
h2{font-size:26px;margin:44px 0 14px}
h3{font-size:15px;margin:16px 0 2px;color:var(--mut)}
.mut{color:var(--mut)}
.err{color:var(--red)}
.btn{display:inline-block;border:0;border-radius:10px;background:var(--ink);color:#fff;font:600 17px Heebo,sans-serif;padding:14px 26px;cursor:pointer;text-decoration:none}
.btn:hover{background:var(--red)}
.btn:disabled{opacity:.4;cursor:not-allowed;background:var(--ink)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.svc{display:flex;gap:10px;align-items:baseline;padding:8px 0}
.dots{flex:1;border-bottom:2px dotted var(--line)}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-top:44px}
.box h2,dialog h2{margin:0 0 14px}
.step{font-weight:600;margin:22px 0 10px;display:flex;gap:10px;align-items:center}
.n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--ink);color:#fff;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.days{flex-wrap:nowrap;overflow-x:auto;padding-bottom:6px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font:inherit;color:var(--ink);cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip:disabled{opacity:.35;cursor:not-allowed}
.day{display:flex;flex-direction:column;align-items:center;min-width:64px;flex:none;line-height:1.35}
.day small{font-size:13px;opacity:.8}
input{width:100%;font:inherit;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px}
.msg{margin-top:12px;font-weight:600;min-height:1.6em}
footer{margin-top:44px;padding-top:20px;border-top:1px solid var(--line);color:var(--mut);font-size:15px}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;font:inherit;cursor:pointer;padding:6px 0;margin-top:10px}
dialog{border:0;border-radius:16px;padding:20px;width:min(92vw,520px);max-height:85vh;color:var(--ink);font:inherit}
dialog::backdrop{background:#14223a99}
.ap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div class="pole"></div>
<main>
  <header>
    <h1>המספרה של דני</h1>
    <p class="mut">תספורת וגילוח בהזמנה מראש. בוחרים שעה, ומקבלים תור. בלי טלפונים ובלי המתנה.</p>
    <a class="btn" href="#book">קבעו תור</a>
  </header>

  <h2>מחירון</h2>
  <div id="prices"></div>

  <section class="box" id="book">
    <h2>קביעת תור</h2>
    <div class="step"><span class="n">1</span>איזה שירות?</div>
    <div class="chips" id="svcs"></div>
    <div class="step"><span class="n">2</span>איזה יום?</div>
    <div class="chips days" id="days"></div>
    <div class="step"><span class="n">3</span>באיזו שעה?</div>
    <div class="chips" id="times"><span class="mut">בחרו שירות ויום כדי לראות שעות פנויות</span></div>
    <div class="step"><span class="n">4</span>הפרטים שלכם</div>
    <input id="nm" placeholder="שם מלא" autocomplete="name" oninput="ready()">
    <input id="ph" type="tel" inputmode="tel" placeholder="טלפון" autocomplete="tel" oninput="ready()">
    <button class="btn" id="go" disabled>קבעו את התור</button>
    <div class="msg" id="msg" role="status"></div>
  </section>

  <footer>
    <div id="info"></div>
    <button class="link" id="adm">כניסת מנהל</button>
  </footer>
</main>

<dialog id="dlg">
  <div id="login">
    <h2>כניסת מנהל</h2>
    <form id="lf">
      <input id="pw" type="password" placeholder="סיסמה" autocomplete="current-password" required>
      <button class="btn">כניסה</button>
    </form>
    <div class="msg" id="lmsg"></div>
  </div>
  <div id="panel" hidden>
    <h2>התורים הקרובים</h2>
    <div id="list"></div>
    <button class="chip" id="out" type="button" style="margin-top:14px">יציאה</button>
  </div>
  <button class="chip" id="close" type="button" style="margin-top:14px">סגירה</button>
</dialog>

<script>
/* ===== הגדרות: ערכו כאן ===== */
const API = "PASTE_APPS_SCRIPT_URL_HERE";
const BIZ = {name:"המספרה של דני", phone:"050-0000000", addr:"רחוב הרצל 1, תל אביב", hours:"ראשון עד שישי, 9:00–19:00"};

const $ = s => document.querySelector(s), pad = n => String(n).padStart(2,"0");
const el = (t,c,x) => {const e = document.createElement(t); if(c) e.className = c; if(x != null) e.textContent = x; return e};
const iso = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fmt = s => new Date(s+"T12:00").toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long"});
const post = b => fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(b)}).then(r => r.json());
const get = q => fetch(API+"?"+new URLSearchParams(q)).then(r => r.json());
const say = (s,t,bad) => {const m = $(s); m.textContent = t; m.className = "msg"+(bad ? " err" : "")};
const mark = (p,b) => p.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b));
const store = (k,v) => {try{v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k,v)}catch(e){}};
let cfg, S = {svc:null,date:null,time:null};

function ready(){
  $("#go").disabled = !(S.svc != null && S.date && S.time && $("#nm").value.trim().length > 1 && /^0\d{8,9}$/.test($("#ph").value.replace(/\D/g,"")));
}

async function init(){
  document.title = BIZ.name+" | קביעת תור";
  $("h1").textContent = BIZ.name;
  $("#info").append(el("div",0,BIZ.addr), el("div",0,BIZ.hours));
  const tel = el("a",0,BIZ.phone); tel.href = "tel:"+BIZ.phone.replace(/\D/g,""); $("#info").append(tel);
  try{ cfg = await get({action:"config"}); }
  catch(e){ return say("#msg","אין חיבור למערכת התורים. נסו שוב או התקשרו: "+BIZ.phone, 1); }
  const C = $("#svcs"), D = $("#days"), f = new Intl.DateTimeFormat("he-IL",{weekday:"short"});
  cfg.services.forEach(([n,m,p],i) => {
    const r = el("div","svc"); r.append(el("b",0,n), el("span","dots"), el("span",0,"₪"+p)); $("#prices").append(r);
    const b = el("button","chip",n+" · "+m+" דק׳"); b.type = "button"; b.setAttribute("aria-pressed","false");
    b.onclick = () => {S.svc = i; S.time = null; mark(C,b); slots()}; C.append(b);
  });
  for(let i = 0; i < 14; i++){
    const d = new Date(); d.setDate(d.getDate()+i);
    const b = el("button","chip day"); b.type = "button"; b.setAttribute("aria-pressed","false");
    b.append(el("small",0,i ? f.format(d) : "היום"), el("b",0,d.getDate()+"/"+(d.getMonth()+1)));
    b.disabled = cfg.closed.includes(d.getDay());
    b.onclick = () => {S.date = iso(d); S.time = null; mark(D,b); slots()}; D.append(b);
  }
}

async function slots(){
  const T = $("#times"); T.replaceChildren(); ready();
  if(S.svc == null || !S.date) return T.append(el("span","mut","בחרו שירות ויום כדי לראות שעות פנויות"));
  T.append(el("span","mut","טוען שעות..."));
  try{
    const r = await get({action:"slots",date:S.date,svc:S.svc});
    T.replaceChildren();
    if(!r.slots.length) return T.append(el("span","mut","אין שעות פנויות ביום הזה. נסו יום אחר."));
    r.slots.forEach(t => {
      const b = el("button","chip",t); b.type = "button"; b.setAttribute("aria-pressed","false");
      b.onclick = () => {S.time = t; mark(T,b); ready()}; T.append(b);
    });
  }catch(e){ T.replaceChildren(el("span","err","שגיאה בטעינת השעות. נסו שוב.")); }
}

$("#go").onclick = async () => {
  $("#go").disabled = true; say("#msg","קובעים את התור...");
  try{
    const r = await post({action:"book",svc:S.svc,date:S.date,time:S.time,name:$("#nm").value.trim(),phone:$("#ph").value.trim()});
    if(r.ok){
      $("#book").replaceChildren(el("h2",0,"התור נקבע"), el("p",0,cfg.services[S.svc][0]+", "+fmt(S.date)+", בשעה "+S.time),
        el("p","mut","לשינוי או ביטול התקשרו: "+BIZ.phone));
    } else { say("#msg", r.error || "לא הצלחנו לקבוע את התור", 1); S.time = null; slots(); }
  }catch(e){ say("#msg","שגיאת תקשורת. נסו שוב.",1); ready(); }
};

/* ===== מנהל ===== */
const dlg = $("#dlg");
const show = on => {$("#login").hidden = on; $("#panel").hidden = !on};
$("#adm").onclick = () => {dlg.showModal(); let p = null; try{p = sessionStorage.getItem("ap")}catch(e){} if(p) load(p)};
$("#close").onclick = () => dlg.close();
$("#out").onclick = () => {store("ap",null); $("#pw").value = ""; show(false)};
$("#lf").onsubmit = e => {e.preventDefault(); load($("#pw").value)};

async function load(pass){
  say("#lmsg","בודקים...");
  try{
    const r = await post({action:"list",pass});
    if(!r.ok){ store("ap",null); show(false); return say("#lmsg", r.error || "סיסמה שגויה", 1); }
    store("ap",pass); say("#lmsg",""); show(true); draw(r.items,pass);
  }catch(e){ say("#lmsg","שגיאת תקשורת",1); }
}

function draw(items,pass){
  const P = $("#list"); P.replaceChildren();
  if(!items.length) return P.append(el("p","mut","אין תורים קרובים."));
  let last = "";
  items.forEach(it => {
    const [d,t] = it.start.split("T");
    if(d !== last){ P.append(el("h3",0,fmt(d))); last = d; }
    const row = el("div","ap"), info = el("div");
    info.append(el("b",0,t+"  "+it.title), el("div","mut",it.desc));
    const x = el("button","chip","ביטול"); x.type = "button";
    x.onclick = async () => {
      if(!confirm("לבטל את התור?")) return;
      x.disabled = true;
      const q = await post({action:"cancel",pass,id:it.id});
      q.ok ? load(pass) : alert(q.error || "שגיאה");
    };
    row.append(info,x); P.append(row);
  });
}

init();
</script>
</body>
</html>
