
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0b0b">
  <title>מסך הספר | תורים</title>
  <style>
    :root {
      --bg: #0b0b0b;
      --panel: #151515;
      --gold: #d6b36a;
      --text: #f7f3e9;
      --muted: #aaa39a;
      --border: #34302a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at top, #282116 0, var(--bg) 55%);
      color: var(--text);
      font-family: Arial, sans-serif;
    }

    button, input { font: inherit; }

    .wrap {
      width: min(920px, 100%);
      margin: auto;
      padding: 24px 16px 50px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo {
      color: var(--gold);
      font-size: 13px;
      letter-spacing: 4px;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(26px, 5vw, 38px);
      margin: 0 0 8px;
    }

    .sub, .muted { color: var(--muted); }

    .panel, .booking {
      background: rgba(21, 21, 21, .96);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
    }

    .panel {
      max-width: 430px;
      margin: 30px auto;
    }

    label {
      display: block;
      margin: 15px 0 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #4a4338;
      border-radius: 10px;
      background: #090909;
      color: white;
      outline: none;
    }

    input:focus { border-color: var(--gold); }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: var(--gold);
      color: #17120a;
    }

    .secondary {
      background: #29251f;
      color: var(--text);
      border: 1px solid #494033;
    }

    .wide { width: 100%; margin-top: 16px; }

    .error {
      color: #ff9e9e;
      margin-top: 12px;
      line-height: 1.5;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 22px 0;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab {
      color: var(--text);
      background: #25221d;
      border: 1px solid #403a30;
    }

    .tab.active {
      background: var(--gold);
      color: #17120a;
    }

    .bookings {
      display: grid;
      gap: 12px;
    }

    .booking {
      padding: 18px;
    }

    .booking-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .booking h3 {
      margin: 0 0 8px;
      font-size: 19px;
      overflow-wrap: anywhere;
    }

    .date {
      color: var(--gold);
      font-weight: bold;
      line-height: 1.6;
    }

    .status {
      white-space: nowrap;
      border-radius: 30px;
      padding: 6px 10px;
      font-size: 12px;
      background: #2b3427;
      color: #c9efb8;
    }

    .status.done {
      background: #303030;
      color: #d0d0d0;
    }

    .details {
      margin-top: 12px;
      line-height: 1.9;
      color: #ddd7cc;
      overflow-wrap: anywhere;
    }

    a { color: var(--gold); }

    .empty {
      text-align: center;
      padding: 35px 15px;
      border: 1px dashed #4a4338;
      border-radius: 14px;
      color: var(--muted);
    }

    .hidden { display: none !important; }

    .foot {
      text-align: center;
      margin-top: 25px;
      font-size: 12px;
      color: #817a70;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div class="logo">BARBER · PRIVATE</div>
      <h1>מסך הספר</h1>
      <div class="sub">צפייה בתורים בלבד</div>
    </header>

    <section id="loginPanel" class="panel">
      <h2>כניסה למערכת</h2>
      <p class="muted">יש להזין את סיסמת הספר.</p>

      <form id="loginForm">
        <label for="password">סיסמת הספר</label>
        <input id="password"
               type="password"
               autocomplete="current-password"
               required
               maxlength="200">
        <button class="primary wide" id="loginButton" type="submit">
          כניסה
        </button>
      </form>
      <div id="loginError" class="error" role="alert"></div>
    </section>

    <section id="dashboard" class="hidden">
      <div class="toolbar">
        <div>
          <strong>התורים שלך</strong>
          <div id="lastUpdated" class="muted" style="margin-top:6px;font-size:12px"></div>
        </div>
        <div class="tabs">
          <button class="tab active" data-tab="pending">ממתינים / עתידיים</button>
          <button class="tab" data-tab="done">הסתיימו</button>
          <button class="secondary" id="refreshButton">רענון</button>
          <button class="secondary" id="logoutButton">יציאה</button>
        </div>
      </div>

      <div id="loadError" class="error" role="alert"></div>
      <div id="bookingList" class="bookings"></div>
    </section>

    <div class="foot">גישה לקריאה בלבד · אין אפשרות לערוך או למחוק תורים</div>
  </main>

  <script>
    const API = "https://script.google.com/macros/s/AKfycbzO_bXEm37XRQ-mBkIYLquYOk3DWZ9SMwiYlkfyk1Ywb5azu_8t0SxF_yO1UY6kUDuibA/exec";

    const $ = id => document.getElementById(id);
    let password = "";
    let currentTab = "pending";
    let bookings = [];

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, ch => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[ch]));
    }

    function formatDate(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "תאריך לא זמין";

      return new Intl.DateTimeFormat("he-IL", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        timeZone: "Asia/Jerusalem"
      }).format(date);
    }

    async function requestBookings() {
      if (!API || API.includes("PASTE_APPS_SCRIPT_URL_HERE")) {
        throw new Error("צריך להגדיר את כתובת Apps Script בקובץ.");
      }

      const response = await fetch(API, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        cache: "no-store",
        body: JSON.stringify({
          action: "barberList",
          password: password
        })
      });

      const raw = await response.text();
      let result;

      try {
        result = JSON.parse(raw);
      } catch (_) {
        throw new Error("השרת לא החזיר תשובה תקינה. בדוק את כתובת הפריסה.");
      }

      if (!response.ok || !result.ok) {
        throw new Error(result.error || "לא ניתן לטעון את התורים.");
      }

      if (result.role !== "barber_read_only") {
        throw new Error("ההרשאה שהתקבלה אינה תקינה.");
      }

      return Array.isArray(result.items) ? result.items : [];
    }

    function renderBookings() {
      const list = $("bookingList");
      const filtered = bookings
        .filter(item => item.status === currentTab)
        .sort((a, b) => new Date(a.start) - new Date(b.start));

      if (!filtered.length) {
        list.innerHTML = '<div class="empty">אין תורים להצגה בקטגוריה הזו.</div>';
        return;
      }

      list.innerHTML = filtered.map(item => {
        const phone = String(item.phone || "").replace(/[^\d+]/g, "");
        const phoneLine = phone
          ? `<div>טלפון: <a href="tel:${escapeHtml(phone)}">${escapeHtml(item.phone)}</a></div>`
          : "";

        return `
          <article class="booking">
            <div class="booking-top">
              <div>
                <h3>${escapeHtml(item.customer || "לקוח")}</h3>
                <div class="date">${escapeHtml(formatDate(item.start))}</div>
              </div>
              <span class="status ${item.status === "done" ? "done" : ""}">
                ${item.status === "done" ? "הסתיים" : "עתידי"}
              </span>
            </div>
            <div class="details">
              <div>שירות: ${escapeHtml(item.service || "לא צוין")}</div>
              ${phoneLine}
              <div>סיום: ${escapeHtml(formatDate(item.end))}</div>
            </div>
          </article>
        `;
      }).join("");
    }

    async function loadBookings() {
      $("loadError").textContent = "";
      $("refreshButton").disabled = true;
      $("refreshButton").textContent = "טוען…";

      try {
        bookings = await requestBookings();
        renderBookings();
        $("lastUpdated").textContent =
          "עודכן: " + new Intl.DateTimeFormat("he-IL", {
            hour: "2-digit",
            minute: "2-digit"
          }).format(new Date());
      } catch (error) {
        $("loadError").textContent = error.message || "טעינת התורים נכשלה.";
      } finally {
        $("refreshButton").disabled = false;
        $("refreshButton").textContent = "רענון";
      }
    }

    $("loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      const entered = $("password").value;

      if (!entered) return;

      password = entered;
      $("loginButton").disabled = true;
      $("loginButton").textContent = "מתחבר…";
      $("loginError").textContent = "";

      try {
        const items = await requestBookings();
        bookings = items;
        $("loginPanel").classList.add("hidden");
        $("dashboard").classList.remove("hidden");
        $("password").value = "";
        renderBookings();
        $("lastUpdated").textContent =
          "עודכן: " + new Intl.DateTimeFormat("he-IL", {
            hour: "2-digit",
            minute: "2-digit"
          }).format(new Date());
      } catch (error) {
        password = "";
        $("loginError").textContent = error.message || "הכניסה נכשלה.";
      } finally {
        $("loginButton").disabled = false;
        $("loginButton").textContent = "כניסה";
      }
    });

    document.querySelectorAll("[data-tab]").forEach(button => {
      button.addEventListener("click", () => {
        currentTab = button.dataset.tab;
        document.querySelectorAll("[data-tab]").forEach(tab => {
          tab.classList.toggle("active", tab === button);
        });
        renderBookings();
      });
    });

    $("refreshButton").addEventListener("click", loadBookings);

    $("logoutButton").addEventListener("click", () => {
      password = "";
      bookings = [];
      currentTab = "pending";
      $("dashboard").classList.add("hidden");
      $("loginPanel").classList.remove("hidden");
      $("loginError").textContent = "";
      $("loadError").textContent = "";
      document.querySelectorAll("[data-tab]").forEach(tab => {
        tab.classList.toggle("active", tab.dataset.tab === "pending");
      });
    });
  </script>
</body>
</html>
